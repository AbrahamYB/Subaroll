name: Release Subaroll apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-15
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg --config src-tauri/tauri.release.macos.json
          - name: Windows 11 x64
            os: windows-2022
            rust_target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi --config src-tauri/tauri.release.windows.json

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare bundled FFmpeg for Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: npm run prepare:ffmpeg:win

      - name: Provide FFmpeg for macOS tests
        if: runner.os == 'macOS'
        shell: bash
        run: command -v ffmpeg >/dev/null || brew install ffmpeg

      - name: Run automated tests
        run: npm test

      - name: Build and publish native installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Subaroll ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
