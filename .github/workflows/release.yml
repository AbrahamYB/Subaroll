name: Release Subaroll apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing short release tag to build or update, such as v1.2
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-15
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.macos.json
          - name: Windows 11 x64
            os: windows-2022
            rust_target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi --config src-tauri/tauri.release.windows.json

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare bundled FFmpeg for Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: npm run prepare:ffmpeg:win

      - name: Provide FFmpeg for macOS tests
        if: runner.os == 'macOS'
        shell: bash
        run: command -v ffmpeg >/dev/null || brew install ffmpeg

      - name: Run automated tests
        run: npm test

      - name: Derive major.minor asset version from release tag
        id: release_version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: echo "short=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Find existing release
        if: github.event_name == 'workflow_dispatch'
        id: existing_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .id)
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Build and upload native installer
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: Subaroll ${{ inputs.release_tag || github.ref_name }}
          releaseId: ${{ steps.existing_release.outputs.id }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: "[name]_${{ steps.release_version.outputs.short }}_[arch][setup][ext]"
          args: ${{ matrix.args }}

      - name: Verify Windows installer payloads
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $setup = Get-ChildItem "$bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          $msi = Get-ChildItem "$bundle/msi" -Filter "*.msi" | Select-Object -First 1
          if (-not $setup -or -not $msi) { throw "Expected both Windows installers." }

          $setupPath = Join-Path $env:RUNNER_TEMP "subaroll-nsis-check"
          $msiPath = Join-Path $env:RUNNER_TEMP "subaroll-msi-check"
          & 7z x $setup.FullName "-o$setupPath" -y
          if ($LASTEXITCODE -ne 0) { throw "Could not extract the setup EXE." }
          $msiProcess = Start-Process msiexec.exe -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$msiPath`"" -Wait -PassThru
          if ($msiProcess.ExitCode -ne 0) { throw "Could not extract the MSI." }

          foreach ($payload in @($setupPath, $msiPath)) {
            $app = Get-ChildItem -LiteralPath $payload -Recurse -Filter "Subaroll.exe" | Select-Object -First 1
            if (-not $app) { throw "Subaroll.exe is missing in $payload." }
            $bytes = [IO.File]::ReadAllBytes($app.FullName)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ([BitConverter]::ToUInt16($bytes, ($peOffset + 92)) -ne 2) {
              throw "Subaroll.exe in $payload is not a Windows GUI executable."
            }
            foreach ($tool in @("ffmpeg.exe", "ffprobe.exe")) {
              $toolPath = Join-Path $app.DirectoryName $tool
              if (-not (Test-Path -LiteralPath $toolPath)) { throw "$tool is missing beside Subaroll.exe in $payload." }
              & $toolPath -version
              if ($LASTEXITCODE -ne 0) { throw "$tool could not run from $payload." }
            }
          }
