name: Release Subaroll apps

on:
  push:
    tags:
      - "v1.1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-15
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg --config src-tauri/tauri.release.macos.json
          - name: Windows 11 x64
            os: windows-2022
            rust_target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi --config src-tauri/tauri.release.windows.json

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare bundled FFmpeg for Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: npm run prepare:ffmpeg:win

      - name: Provide FFmpeg for macOS tests
        if: runner.os == 'macOS'
        shell: bash
        run: command -v ffmpeg >/dev/null || brew install ffmpeg

      - name: Run automated tests
        run: npm test

      - name: Build and publish native installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.1
          releaseName: Subaroll v1.1
          releaseBody: |
            # Subaroll 1.1

            ## Changes since 1.0

            ### Discord compression keeps more of the source video

            The 1.0 bitrate thresholds could lower resolution before the selected size limit required it. The planner now keeps 1080p H.264 when its video budget is at least 2 Mbps at 30 fps, and chooses lower resolutions only as the budget falls. AV1 uses its own thresholds. The planner never upscales a source.

            Frame rate is now part of that decision. A 60 fps source stays at 60 fps when the budget can support at least 720p. When it cannot, the planner reduces frame rate to 30 fps and recalculates the best resolution for the remaining bitrate.

            ### App name and icon

            The product, window, installer, and repository are now named **Subaroll**. The CC icon is updated for the macOS and Windows app bundles. The macOS bundle identifier remains unchanged so existing preferences are retained.

            ### Build and release reliability

            The CI test runner now checks reported test failures and resolves Cargo using the configured Rust toolchain. Native release packages are built for Apple silicon macOS and Windows 11 x64.

            ## Downloads

            - **macOS 11+, Apple silicon (M1 or newer):** ARM64 DMG. Drag Subaroll into Applications; right-click → Open on first launch. Requires `brew install ffmpeg-full`.
            - **Windows 11 x64:** Setup EXE (recommended) or MSI. FFmpeg and FFprobe are included.

            Installers are unsigned and not notarized. Windows SmartScreen may ask you to select **More info → Run anyway**.

            ## Compression credit

            Subaroll's target-size compressor is independently written in Rust and is based on the workflow and design of [vladaad's DiscordCompressor](https://github.com/vladaad/discordcompressor). Full credit to vladaad for the original compression approach. No upstream compressor binary is embedded.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          args: ${{ matrix.args }}
