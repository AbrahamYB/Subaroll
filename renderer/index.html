<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subaroll</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="window-drag-region" data-tauri-drag-region aria-hidden="true"></div>
  <main class="app-shell">
    <div class="stage-col" id="stageCol">
      <header class="workspace-bar">
        <div class="mode-switch" role="group" aria-label="Export mode">
          <button id="subtitleMode" class="active" type="button" aria-pressed="true">Burn subtitles</button>
          <button id="compressMode" type="button" aria-pressed="false">Compress video</button>
        </div>
        <button id="updateButton" class="update-button" type="button" aria-live="polite">Check for updates</button>
      </header>

      <section class="monitor" aria-label="Video monitor">
        <div class="preview-slot">
          <div id="previewStage" class="preview-stage">
            <img id="previewFrame" class="preview-frame" alt="Video preview frame">
            <div id="positionGuide" class="position-guide" aria-hidden="true" hidden>
              <div class="guide-line"><span id="guideValue"></span></div>
            </div>
            <div id="emptyPreview" class="empty-preview">
              <span>Video preview</span>
              <button id="emptyVideoPicker" type="button">Open a video…</button>
            </div>
            <div id="previewSpinner" class="spinner" role="status" aria-label="Rendering preview" hidden></div>
          </div>
          <button id="positionGuideToggle" type="button" class="guide-toggle subtitle-only" aria-pressed="false" disabled>Position guide</button>
          <div class="status-row">
            <p id="status" class="status"></p>
          </div>
        </div>
        <div class="seek-row">
          <span id="seekCurrent">00:00</span>
          <input id="seek" aria-label="Preview time" type="range" min="0" max="100" value="0" step="0.1" disabled>
          <span id="seekDuration">00:00</span>
        </div>
      </section>

      <section class="dock" id="dock" aria-label="Video workspace">
        <div class="dock-main">
          <div class="input-files">
            <label id="videoLabel" class="sr-only" for="videoPicker">Video</label>
            <button id="videoPicker" class="file-picker" type="button" aria-labelledby="videoLabel videoName"><span id="videoName">Choose video…</span><b>Browse</b></button>
            <label id="subtitleLabel" class="sr-only subtitle-only" for="subtitlePicker">Subtitles</label>
            <button id="subtitlePicker" class="file-picker subtitle-only" type="button" aria-labelledby="subtitleLabel subtitleName"><span id="subtitleName">Choose subtitles…</span><b>Browse</b></button>
          </div>
          <section class="adjustments subtitle-only" aria-label="Subtitle adjustments">
            <div class="adjustment-sliders">
              <div class="slider" data-marks="0:No delay">
                <div class="hd"><label for="delay">Delay</label><output id="delayValue" for="delay">0.00 s</output></div>
                <input id="delay" type="range" min="-5" max="5" value="0" step="0.05">
              </div>
              <div class="slider" data-marks="50:Middle">
                <div class="hd"><label for="position">Position</label><output id="positionValue" for="position">Original</output></div>
                <input id="position" type="range" min="0" max="100" value="95" step="1">
              </div>
              <div class="slider" data-marks="100:Original">
                <div class="hd"><label for="scale">Size</label><output id="scaleValue" for="scale">100%</output></div>
                <input id="scale" type="range" min="50" max="200" value="100" step="1">
              </div>
            </div>
          </section>

          <section id="compressionOptions" class="adjustments compress-only" aria-label="Compression target" hidden>
            <div class="slider" data-marks="25:25 MB;50:50 MB;100:100 MB;250:250 MB">
              <div class="hd">
                <h2><label for="targetRange">Target size</label></h2>
                <label class="val-edit">
                  <input id="targetSize" type="number" min="1" max="750" step="1" value="25" aria-label="Target size in megabytes">
                  <span>MB</span>
                </label>
              </div>
              <input id="targetRange" type="range" min="1" max="750" value="25" step="1">
            </div>
            <div id="estimate" class="estimate">
              <div><span>Resolution</span><b id="estRes">—</b></div>
              <div><span>Source FPS</span><b id="estFps">—</b></div>
              <div><span>Estimated bitrate</span><b id="estRate">—</b></div>
            </div>
            <small id="estNote" class="hint" aria-live="polite"></small>
          </section>

        </div>

        <section class="dock-export" aria-labelledby="exportTitle">
          <h2 id="exportTitle">Export</h2>
          <div class="export-settings">
            <div class="export-encoder">
              <label for="windowsEncoder">Encoder</label>
              <select id="windowsEncoder" disabled>
                <option value="auto">Auto</option>
              </select>
            </div>
            <div class="slider export-quality subtitle-only" data-marks="90:Recommended">
              <div class="hd"><label for="quality">Encoding quality</label><output id="qualityValue" for="quality">CQ 90</output></div>
              <input id="quality" aria-describedby="qualityHint" type="range" min="60" max="100" value="90" step="1">
              <p id="qualityHint" class="sr-only"></p>
            </div>
            <div class="export-codec compress-only" hidden>
              <label for="compressionCodec">Codec</label>
              <select id="compressionCodec">
                <option value="auto">Auto</option>
                <option value="h264">H.264</option>
              </select>
            </div>
          </div>

          <div class="export-commit">
            <div id="progressWrap" class="progress-wrap" hidden>
              <div class="progress-track"><div id="progressBar"></div></div>
              <strong id="progressValue">0%</strong>
            </div>
            <div class="actions">
              <button id="cancelButton" class="secondary" type="button" hidden>Cancel</button>
              <button id="testButton" class="secondary test-button" type="button" disabled>30s test</button>
              <button id="exportButton" class="primary" type="button" disabled>Burn subtitles</button>
            </div>
          </div>
        </section>

      </section>
    </div>
  </main>
  <script src="tauri-api.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
