[package]
name = "subaroll"
version = "1.2.4"
description = "Native subtitle burn-in and Discord compression tool"
authors = ["Local project"]
edition = "2021"

[lib]
name = "subaroll_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
regex = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
